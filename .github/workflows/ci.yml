name: Daybasket checks
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser and integration tests
        run: |
          pnpm dev > /tmp/daybasket.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4000/api/v1/ready && curl -sf http://localhost:3000 > /dev/null; then break; fi
            sleep 2
          done
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
